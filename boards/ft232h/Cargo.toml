[package]
name = "smart-leds-fx-ft232h"
version = "0.1.0"
description = "Lighting effects for LED's using the Adafruit FT232H Breakout"
authors = ["Jordan Williams <jordan@jwillikers.com>"]
edition = "2021"
keywords = [
  "adafruit",
  "dotstar",
  "embedded",
  "ft232h",
  "ftdi",
  "fx",
  "led",
  "libftdi",
  "neopixel",
  "smart-leds",
  "ws2812",
]
license = "MIT OR Apache-2.0"
readme = "README.adoc"
repository = "https://github.com/jwillikers/smart-leds-fx"

[dependencies]
embedded-hal = "1.0"
ftdi-embedded-hal = { version = "0.24", features = ["ftdi"] }
smart-leds = "0.4"
ws2812-spi = "0.5"

[dependencies.smart-leds-fx]
path = "../../smart-leds-fx"
version = "0.1.0"
