[package]
name = "smart-leds-fx-qt-py-rp2040"
version = "0.1.0"
description = "A soft blink effect for the onboard Neopixel on the Adafruit QT Py RP2040"
authors = ["Jordan Williams <jordan@jwillikers.com>"]
edition = "2021"
keywords = [
  "dotstar",
  "embedded",
  "fx",
  "led",
  "neopixel",
  "no-std",
  "smart-leds",
  "ws2812",
]
license = "MIT OR Apache-2.0"
readme = "README.adoc"
repository = "https://github.com/jwillikers/smart-leds-fx"
resolver = "2"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded_hal_0_2 = { package = "embedded-hal", version = "0.2", features = [
  "unproven",
] }
fugit = "0.3"
nb = "1.1"
panic-halt = "1.0"
# The pin definitions in src/lib.rs replace the adafruit-qt-py-rp2040 board support package.
# The board support package depends on rp2040-hal 0.10, which is incompatible with ws2812-pio 0.9.
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.11", features = ["critical-section-impl", "rt"] }
smart-leds = "0.4"
ws2812-pio = "0.9"

[dependencies.smart-leds-fx]
path = "../../smart-leds-fx"
version = "0.1.0"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
