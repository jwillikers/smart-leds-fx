[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Choose a default "cargo run" tool:
# - probe-rs provides flashing and RTT via a hardware debugger
# - gdb can be used with OpenOCD, which is configured in openocd.cfg and openocd.gdb
runner = "probe-rs run --chip ATSAMD51J19A --protocol swd"
# runner = "gdb -x openocd.gdb"
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x"]

[build]
target = "thumbv7em-none-eabihf"
