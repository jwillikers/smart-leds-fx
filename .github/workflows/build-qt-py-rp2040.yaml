name: Build QT Py RP2040

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-qt-py-rp2040.yaml
      - .justfile
      - boards/qt-py-rp2040/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-qt-py-rp2040.yaml
      - .justfile
      - boards/qt-py-rp2040/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  workflow_dispatch:

jobs:
  build-qt-py-rp2040:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build
        run: nix build --print-build-logs .#qt-py-rp2040
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: smart-leds-fx-qt-py-rp2040
          path: result/bin/
  check-qt-py-rp2040:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Lint with Clippy
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-rp2040-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-rp2040-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.qt-py-rp2040-audit
