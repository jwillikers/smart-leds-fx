name: Build Feather M4 Express

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-feather-m4-express.yaml
      - .justfile
      - boards/feather-m4-express/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-feather-m4-express.yaml
      - .justfile
      - boards/feather-m4-express/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  workflow_dispatch:

jobs:
  build-feather-m4-express:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build
        run: nix build --print-build-logs .#feather-m4-express
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: smart-leds-fx-feather-m4-express
          path: result/bin/
  check-feather-m4-express:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Lint with Clippy
        run: nix build --print-build-logs .#checks.x86_64-linux.feather-m4-express-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.feather-m4-express-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.feather-m4-express-audit
