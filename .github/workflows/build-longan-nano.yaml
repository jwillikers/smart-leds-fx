name: Build Longan Nano

"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-longan-nano.yaml
      - .justfile
      - boards/longan-nano/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-longan-nano:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '*.nix'
              - .github/workflows/build-longan-nano.yaml
              - .justfile
              - boards/longan-nano/**
              - deny.toml
              - flake.lock
              - smart-leds-fx/Cargo.toml
              - smart-leds-fx/src/**
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: nix build --print-build-logs .#longan-nano
      - name: Upload firmware
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smart-leds-fx-longan-nano
          path: result/bin/
  check-longan-nano:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '*.nix'
              - .github/workflows/build-longan-nano.yaml
              - .justfile
              - boards/longan-nano/**
              - deny.toml
              - flake.lock
              - smart-leds-fx/Cargo.toml
              - smart-leds-fx/src/**
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Lint with Clippy
        if: steps.gate.outputs.run == 'true'
        run: nix build --print-build-logs .#checks.x86_64-linux.longan-nano-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: steps.gate.outputs.run == 'true' && (success() || failure())
        run: nix build --print-build-logs .#checks.x86_64-linux.longan-nano-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: steps.gate.outputs.run == 'true' && (success() || failure())
        run: nix build --print-build-logs .#checks.x86_64-linux.longan-nano-audit
