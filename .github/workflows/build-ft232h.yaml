name: Build FT232H

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-ft232h.yaml
      - .justfile
      - boards/ft232h/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  push:
    branches: ["main"]
    paths:
      - '*.nix'
      - .github/workflows/build-ft232h.yaml
      - .justfile
      - boards/ft232h/**
      - deny.toml
      - flake.lock
      - smart-leds-fx/Cargo.toml
      - smart-leds-fx/src/**
  workflow_dispatch:

jobs:
  build-ft232h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build
        run: nix build --print-build-logs .#ft232h
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: smart-leds-fx-ft232h
          path: result/bin/
  check-ft232h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Lint with Clippy
        run: nix build --print-build-logs .#checks.x86_64-linux.ft232h-clippy
      - name: Check licenses, bans, and sources with cargo-deny
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.ft232h-deny
      - name: Audit dependencies for security vulnerabilities with cargo-audit
        if: success() || failure()
        run: nix build --print-build-logs .#checks.x86_64-linux.ft232h-audit
